name: Security Review (decoupled)

on:
  pull_request:
    # 'closed' added so the resolve job (auto-close on merge) can run. The 'security' job explicitly excludes this action below, so opened/
    # synchronize/workflow_dispatch behave exactly as before.
    types: [opened, synchronize, closed]
  workflow_dispatch:

# Serializes runs per-PR (falls back to run_id for workflow_dispatch, which has no PR number). Without this, two pushes in quick succession can race: both
# runs search Jira, both see "not found" — either because the first run's create genuinely hasn't happened yet, or because Jira's search index can lag
# a few seconds behind a write — and both create a duplicate issue for the same finding. cancel-in-progress is false deliberately: a run that's
# mid-write to Jira should be allowed to finish, not be killed and left half-done; later pushes queue behind it instead.
concurrency:
  group: security-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  security:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Get changed files
        id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Local git diff instead of `gh pr diff --name-only`: the GitHub API's
          # diff endpoint (which `gh pr diff` calls) hard-caps at 300 changed
          # files and returns HTTP 406 beyond that. A local git diff between the
          # PR's base and head commits has no such limit.
          git fetch --depth=1 origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          {
            echo "files<<EOF"
            git diff --name-only "$BASE_SHA" "$HEAD_SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Load review prompt
        id: load_review_prompt
        run: |
          {
            echo "content<<PROMPT_EOF"
            cat .github/security-review/prompts/review-skill.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: security
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Optional: Add track_progress: true for visual progress tracking during security reviews
          # track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            <HARD_RULE>
            Only review the changes introduced in this PR — do not flag or analyze
            pre-existing code this PR doesn't touch. Changed files:
            ${{ steps.diff.outputs.files }}
            Write your full analysis with severity [Critical, High, Medium, Low] based on CVSS score and impact, category below title, including reasoning for each finding, to a file at security-review-output.md in the repo root.
            </HARD_RULE>

            ${{ steps.load_review_prompt.outputs.content }}

            <HARD_RULE>
            Reminder: report findings only for files in the changed-files list given at
            the top of this prompt. If you read other files for context (e.g. to check
            whether a middleware or caller mitigates something), that's fine — but do not
            emit a finding whose file is outside that list.
            </HARD_RULE>
            
          claude_args: |
              --json-schema '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string"},"category":{"type":"string"},"file":{"type":"string"},"line":{"type":"number"},"code_snippet":{"type":"string"},"description":{"type":"string"},"impact":{"type":"string"},"recommendation":{"type":"string"}},"required":["severity","category","file","description","impact","code_snippet"]}}}}'
              --allowedTools "Write,Bash(gh pr diff:*)"

      - name: Write structured findings to file
        env:
          STRUCTURED_OUTPUT: ${{ steps.security.outputs.structured_output }}
        run: printf '%s' "$STRUCTURED_OUTPUT" > security-findings.json

      - name: Filter findings to PR diff
        # Belt-and-suspenders enforcement of the <HARD_RULE> above: the prompt can be ignored, this can't. Drops any finding whose file isn't in
        # this PR's changed-files list, and logs a warning when it does so see filter_findings_to_diff.py for why this exists.
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
        run: python3 .github/security-review/scripts/filter_findings_to_diff.py

      - name: Convert findings to SARIF
        run: python3 .github/security-review/scripts/convert_to_sarif.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-results
          path: |
            security-review-output.md
            security-findings.json
            security-findings.sarif
          retention-days: 7
          if-no-files-found: ignore

      - name: Post analysis as PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file security-review-output.md

      - name: Sync Findings to JIRA
        id: jira
        if: always() && github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'master' || startsWith(github.event.pull_request.base.ref, 'release/'))
        env:
          JIRA_BASE_URL: ${{ secrets.jira_base_url }}
          JIRA_PROJECT_KEY: ${{ secrets.jira_project_key }}
          JIRA_STORY_KEY: ${{ secrets.jira_story_key }}
          JIRA_EMAIL: ${{ secrets.jira_email }}
          JIRA_API_TOKEN: ${{ secrets.jira_api_token }}

          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/security-review/scripts/sync_jira.py

      - name: Comment Jira links on PR
        if: always() && github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'master' || startsWith(github.event.pull_request.base.ref, 'release/'))
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: ${{ secrets.jira_base_url }}
        run: |
          if [ -s jira-sync-summary.json ]; then
            python3 .github/security-review/scripts/comment_jira_links.py
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body-file jira-comment.md
          fi

      - name: Security gate
        id: gate
        run: |
          COUNT=$(jq '[.findings[] | select((.severity // "") | ascii_upcase | IN("CRITICAL", "HIGH"))] | length' security-findings.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Critical/High findings: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Found $COUNT CRITICAL/HIGH severity finding(s). Failing the pipeline."
            exit 1
          fi

  # Runs only when a PR actually merges (not on close-without-merge), and only if Jira sync is configured (same secrets.jira_base_url guard used above).
  # Re-scans the files this PR touched and closes any previously-open Jira sub-task whose finding is no longer present in that fresh scan.
  resolve:
    if: github.event.pull_request.merged == true && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'master' || startsWith(github.event.pull_request.base.ref, 'release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history needed so both base.sha and merge_commit_sha below are locally resolvable for a direct git diff.
          fetch-depth: 0

      - name: Get merged PR's changed files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          # Deliberately NOT `gh pr diff --name-only` here: that asks GitHub's API to resolve "the diff for this PR", which does not reliably
          # reflect every commit once a PR has closed (varies by merge strategy — squash in particular replaces the whole commit history
          # with one new commit). Diffing base.sha -> merge_commit_sha directly with git is unambiguous: it's the literal file-level difference
          # between the PR's original base and the exact commit that landed, so it can't silently drop files introduced by earlier commits.
          
          git fetch --depth=1 origin "$BASE_SHA" "$MERGE_SHA" 2>/dev/null || true
          {
            echo "files<<EOF"
            git diff --name-only "$BASE_SHA" "$MERGE_SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Load verify prompt
        id: load_verify_prompt
        run: |
          {
            echo "content<<PROMPT_EOF"
            cat .github/security-review/prompts/verify-skill.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: verify
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }} (already merged)
            <HARD_RULE>
            ${{ steps.load_verify_prompt.outputs.content }}
            Files:
            ${{ steps.diff.outputs.files }}
            </HARD_RULE>
          claude_args: |
            --json-schema '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string"},"category":{"type":"string"},"file":{"type":"string"},"line":{"type":"number"},"code_snippet":{"type":"string"},"description":{"type":"string"},"impact":{"type":"string"},"recommendation":{"type":"string"}},"required":["severity","category","file","description","impact","code_snippet"]}}}}'
            --allowedTools "Bash(gh pr diff:*)"

      - name: Write verification findings to file
        env:
          STRUCTURED_OUTPUT: ${{ steps.verify.outputs.structured_output }}
        run: printf '%s' "$STRUCTURED_OUTPUT" > verification-findings.json

      - name: Resolve Jira issues (close PR's tickets, resync against verification scan)
        id: close
        # Closes every open ticket labeled for this PR unconditionally, then re-runs the same create/reopen/skip logic sync_jira.py uses (shared
        # via jira_common.py) against the fresh verification-findings.json. Anything still actually present gets reopened — same ticket, not a
        # new one — so this only "resolves" what really didn't come back.
        env:
          JIRA_BASE_URL: ${{ secrets.jira_base_url }}
          JIRA_PROJECT_KEY: ${{ secrets.jira_project_key }}
          JIRA_STORY_KEY: ${{ secrets.jira_story_key }}
          JIRA_EMAIL: ${{ secrets.jira_email }}
          JIRA_API_TOKEN: ${{ secrets.jira_api_token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: python3 .github/security-review/scripts/close_resolved_jira_issues.py

      - name: Comment resolution summary on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s jira-resolve-summary.json ]; then
            python3 .github/security-review/scripts/comment_resolution_summary.py
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body-file jira-resolve-comment.md
          fi
